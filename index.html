<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELBA DUNGEON</title>
<script src="game-data.js"></script>
<script src="npc-data.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Gabarito:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1510;--parch:#f4ecd8;--ink:#2a1a0a;--ink2:#5a4a30;--accent:#8b3a0f;--accent2:#c4651a;--gold:#b8952a;--btn-bg:#e8dcc4;--btn-border:#c4b898;--btn-hover:#d8ccb0;--hp-green:#4a7a3a;--hp-red:#8b3a2a;--blue:#3a5a8b}
body{background:var(--bg);color:var(--ink);font-family:'Noto Serif KR',serif;font-weight:400;font-size:15px;line-height:1.9;min-height:100vh}
/* Parchment wrapper */
#wrap{max-width:720px;margin:0 auto;padding:50px 48px;min-height:100vh;background:var(--parch);background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");box-shadow:inset 0 0 80px rgba(0,0,0,.12),4px 0 20px rgba(0,0,0,.4),-4px 0 20px rgba(0,0,0,.4);border-left:3px solid #c4b080;border-right:3px solid #c4b080;position:relative}
#wrap::before,#wrap::after{content:'';position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,#c4b080 20%,#c4b080 80%,transparent)}
#wrap::before{top:16px}#wrap::after{bottom:16px}
/* Decorative corner marks */
.corner{position:absolute;width:20px;height:20px;border-color:#b09060;border-style:solid;border-width:0;opacity:.5}
.corner.tl{top:20px;left:16px;border-top-width:2px;border-left-width:2px}
.corner.tr{top:20px;right:16px;border-top-width:2px;border-right-width:2px}
.corner.bl{bottom:20px;left:16px;border-bottom-width:2px;border-left-width:2px}
.corner.br{bottom:20px;right:16px;border-bottom-width:2px;border-right-width:2px}
h1{font-family:'Noto Serif KR',serif;color:var(--accent);font-size:30px;font-weight:900;letter-spacing:6px;text-align:center;margin-bottom:4px;text-shadow:1px 1px 0 rgba(0,0,0,.1)}
.sub{text-align:center;color:var(--ink2);font-size:12px;letter-spacing:4px;margin-bottom:40px;font-style:italic}
/* Narrative */
.nar{margin-bottom:14px;opacity:0;transform:translateY(5px);animation:fadeUp .6s ease forwards;font-size:15px}
.nar em{color:var(--accent);font-style:italic;font-weight:700}
.nar strong{color:var(--ink);font-weight:700}
.sep{border:none;border-top:1px solid #c4b898;margin:24px 0}
/* Buttons — manuscript style */
.btn{display:block;width:100%;text-align:left;background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--ink);font-family:'Noto Serif KR',serif;font-size:14px;padding:12px 20px;margin-bottom:8px;cursor:pointer;border-radius:0;transition:all .2s;position:relative}
.btn:hover{background:var(--btn-hover);border-color:var(--accent2);color:var(--accent);padding-left:28px}
.btn:hover::before{content:'▸';position:absolute;left:12px;color:var(--accent)}
.btn:disabled{opacity:.3;cursor:default;padding-left:20px}
.btn:disabled:hover::before{content:none}
.btn-accent{border-color:var(--accent2);color:var(--accent);font-weight:700}
/* Input */
.input-row{display:flex;gap:8px;margin-top:20px}
.inp{flex:1;background:#f0e6d0;border:1px solid var(--btn-border);color:var(--ink);font-family:'Noto Serif KR',serif;font-size:14px;padding:12px 16px;border-radius:0;outline:0}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:#a09070}
.sbtn{background:var(--accent);border:none;color:var(--parch);font-family:'Noto Serif KR',serif;font-size:13px;font-weight:700;padding:12px 24px;cursor:pointer;border-radius:0}
.sbtn:hover{background:var(--accent2)}
/* Panels — parchment cards */
.box{background:#efe5cf;border:1px solid #c4b898;border-radius:0;padding:16px 20px;margin:16px 0;font-size:13px;line-height:2;position:relative}
.box-accent{border-left:3px solid var(--accent)}
.box-info{border-left:3px solid var(--blue)}
.box-warn{border-left:3px solid var(--hp-red)}
.box-title{font-weight:700;margin-bottom:6px;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.box-title.t-accent{color:var(--accent)}.box-title.t-info{color:var(--blue)}.box-title.t-warn{color:var(--hp-red)}
/* Stats bar */
#stats{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0;padding:12px 16px;background:#efe5cf;border:1px solid #c4b898;font-size:12px}
.st{display:flex;align-items:center;gap:4px}
.st-label{color:var(--ink2)}
.st-val{color:var(--ink);font-weight:700}
.st-hp{color:var(--hp-green)}.st-atk{color:var(--accent)}.st-def{color:var(--blue)}.st-lv{color:var(--gold)}
/* HP Bar */
.hp-bar{width:120px;height:6px;background:#d8ccb0;border-radius:0;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:4px;border:1px solid #c4b898}
.hp-fill{height:100%;background:var(--hp-green);transition:width .4s}
.hp-fill.low{background:var(--hp-red)}
/* Tile Map — old map style */
#map-container{margin:16px auto;text-align:center;position:relative}
#torch-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;background:radial-gradient(circle 90px at var(--torch-x,50%) var(--torch-y,50%),transparent 0%,rgba(26,21,16,.6) 60%,rgba(26,21,16,.88) 100%);transition:background .05s}
#tilemap{display:inline-grid;gap:0;font-family:'Courier New',monospace;user-select:none;outline:none;border:2px solid #a09060;background:#2a2018}
#tilemap:focus{border-color:var(--accent)}
.t{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.t-w{background:#1a1510;color:#2a2520}.t-f{background:#2a2418;color:#3a3428}
.t-p{background:var(--gold)!important;color:#1a1510!important;border-radius:2px;font-size:14px}
.t-e{border-radius:2px;cursor:default;font-size:11px;border:1px solid rgba(255,60,60,.4)}
.t-e.dead{opacity:.15;border-color:transparent}
.t-s{background:#2a1a10;color:var(--gold);font-size:13px;animation:pulse 1.5s infinite}
.t-i{background:#1a2028;color:#6ac;font-size:14px;animation:pulse 2s infinite;border:1px solid rgba(100,170,200,.3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.t-npc{border-radius:2px;font-size:11px}
#map-hint{text-align:center;font-size:11px;color:var(--ink2);margin-top:8px}
#map-hint kbd{background:#efe5cf;border:1px solid #c4b898;padding:1px 5px;font-size:10px;color:var(--ink2)}
#map-zone{text-align:center;color:var(--ink2);font-size:12px;margin-top:4px;font-style:italic}
/* Battle overlay — dark parchment */
#battle{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(20,16,10,.94);z-index:200;justify-content:center;align-items:center}
#battle.show{display:flex}
#battle-box{max-width:500px;width:90%;padding:30px;background:#2a2018;border:2px solid #5a4a30;box-shadow:0 0 40px rgba(0,0,0,.5)}
.b-announce{font-size:13px;color:#8a7a5a;letter-spacing:2px;text-align:center;margin-bottom:8px;opacity:0;animation:fadeUp .5s .2s forwards}
.b-title{font-family:'Noto Serif KR',serif;font-size:20px;color:var(--parch);text-align:center;margin-bottom:24px;opacity:0;animation:fadeUp .6s .5s forwards}
.b-title strong{color:var(--accent2)}
.b-card{background:#1a1510;border:1px solid #5a4a30;padding:20px;margin-bottom:20px;opacity:0;animation:fadeUp .5s .8s forwards;position:relative}
.b-name{font-family:'Noto Serif KR',serif;font-size:17px;color:var(--parch);font-weight:700}
.b-sub{font-size:11px;color:#8a7a5a;letter-spacing:1px;margin-bottom:10px}
.b-hp-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px;color:#c4b898}
.b-dialog{font-size:13px;color:#c4b898;font-style:italic;margin-top:8px}
#b-log{max-height:120px;overflow-y:auto;font-size:12px;color:#8a7a5a;margin-bottom:16px;padding:8px;background:#14100a;border:1px solid #3a3020}
#b-log p{margin-bottom:4px}
#b-log .dmg{color:#c45a3a}
#b-log .heal{color:#5a9a4a}
#b-log .info{color:var(--gold)}
#b-log .crit{color:#e8a025;font-weight:700}
#b-log .miss{color:#6a6a5a;font-style:italic}
#b-actions{opacity:0;animation:fadeUp .5s 1.1s forwards}
#b-actions .btn{text-align:center;background:#2a2418;border-color:#5a4a30;color:#c4b898}
#b-actions .btn:hover{background:#3a3020;border-color:var(--accent2);color:var(--parch)}
#b-actions .btn:hover::before{color:var(--accent2)}
/* Inventory */
#inv-panel{background:#efe5cf;border:1px solid #c4b898;padding:12px 16px;margin-top:16px;font-size:12px}
.inv-title{color:var(--ink2);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.inv-item{padding:3px 0;color:var(--ink);display:flex;justify-content:space-between}
.inv-item .iname{color:var(--ink);font-weight:700}
.inv-item .icount{color:var(--ink2)}
/* Notification */
#notif{position:fixed;top:-60px;left:50%;transform:translateX(-50%);background:#2a2018;border:1px solid var(--gold);color:var(--gold);padding:10px 28px;font-size:13px;z-index:300;transition:top .4s;white-space:nowrap;font-family:'Noto Serif KR',serif}
#notif.show{top:20px}
/* Game Over */
#gameover{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,5,0,.95);z-index:250;justify-content:center;align-items:center;flex-direction:column;text-align:center}
#gameover.show{display:flex}
#gameover h2{font-family:'Noto Serif KR',serif;color:var(--hp-red);font-size:28px;margin-bottom:16px}
#gameover p{color:#8a7a5a;margin-bottom:24px;font-size:14px}
#gameover .btn{max-width:300px;margin:4px auto;text-align:center;background:#2a2018;border-color:#5a4a30;color:#c4b898}
#gameover .btn:hover{background:#3a3020;color:var(--parch)}
/* Screens */
.screen{display:none}.screen.active{display:block}
/* Animations */
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .3s}
@keyframes dmgFlash{0%{opacity:.4;background:rgba(180,50,30,.5)}100%{opacity:1;background:transparent}}
@keyframes healFlash{0%{opacity:.4;background:rgba(50,140,50,.5)}100%{opacity:1;background:transparent}}
@keyframes throneReveal{0%{background:radial-gradient(circle 0px at 50% 50%,transparent,#1a1510)}30%{background:radial-gradient(circle 60px at 50% 50%,transparent 0%,rgba(26,21,16,.7) 80%,#1a1510 100%)}100%{background:none}}
@keyframes screenFlash{0%{opacity:0}10%{opacity:.5}100%{opacity:0}}
@keyframes bossShake{0%,100%{transform:translate(0)}10%{transform:translate(-3px,-2px)}20%{transform:translate(4px,1px)}30%{transform:translate(-2px,3px)}40%{transform:translate(3px,-1px)}50%{transform:translate(-1px,2px)}60%{transform:translate(2px,-3px)}70%{transform:translate(-4px,1px)}80%{transform:translate(1px,2px)}90%{transform:translate(-2px,-1px)}}
#throne-reveal{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:11;background:#1a1510;animation:throneReveal 2.5s ease forwards}
#screen-flash{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--gold);pointer-events:none;z-index:400;opacity:0;animation:screenFlash .8s ease forwards}
.boss-shake{animation:bossShake .6s ease 3}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--parch)}::-webkit-scrollbar-thumb{background:#c4b898}
</style>
</head>
<body>
<div id="notif"></div>
<div id="battle"><div id="battle-box"></div></div>
<div id="gameover"><h2>You Died</h2><p id="go-msg">어둠이 당신을 집어삼켰다...</p><button class="btn" onclick="retryFloor()">현재 층 처음부터</button><button class="btn" onclick="restart()">처음부터 다시 시작</button></div>
<div id="wrap">
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <!-- TITLE SCREEN -->
  <div class="screen active" id="scr-title">
    <div style="text-align:center;padding-top:80px">
      <h1 id="game-title"></h1>
      <div class="sub" id="game-sub"></div>
    </div>
    <div id="title-intro" style="margin:40px 0"></div>
    <div class="input-row" id="name-input-row">
      <input type="text" class="inp" id="name-inp" placeholder="탐험가의 이름을 입력하세요..." maxlength="20">
      <button class="sbtn" onclick="startGame()">탐험 시작</button>
    </div>
    <div id="title-continue" style="margin-top:16px;display:none">
      <button class="btn btn-accent" onclick="loadGame()">이어서 탐험하기</button>
      <button class="btn" onclick="showNewGame()">처음부터 시작하기</button>
    </div>
  </div>

  <!-- DUNGEON SCREEN -->
  <div class="screen" id="scr-dungeon">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h2 style="font-family:'Noto Serif KR',serif;color:var(--bright);font-size:18px" id="floor-name"></h2>
      <span style="font-size:12px;color:#555" id="floor-num"></span>
    </div>
    <p class="nar" id="floor-intro" style="margin-top:12px"></p>
    <div id="stats"></div>
    <div id="map-container"><div id="tilemap" tabindex="0"></div><div id="torch-overlay"></div></div>
    <div id="map-hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>Space</kbd> 상호작용</div>
    <div id="map-zone"></div>
    <div id="inv-panel"></div>
  </div>

  <!-- FLOOR CLEAR SCREEN -->
  <div class="screen" id="scr-clear">
    <div id="clear-content"></div>
  </div>

  <!-- ENDING SCREEN -->
  <div class="screen" id="scr-ending">
    <div id="ending-content"></div>
  </div>
</div>

<script>
// ═══ STATE ═══
let S={name:'',floor:0,px:0,py:0,hp:100,maxHp:100,atk:12,def:8,level:1,exp:0,expNext:30,
       inventory:{},equip:{weapon:null,armor:null},defeated:[],pickedItems:[],mapActive:false};
const COLS=15,ROWS=15;

function save(){localStorage.setItem('elba-dungeon',JSON.stringify(S))}
function notify(t){const e=document.getElementById('notif');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}

// ═══ SCREENS ═══
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('scr-'+id).classList.add('active')}

// ═══ TITLE ═══
function initTitle(){
  document.getElementById('game-title').textContent=GAME.title;
  document.getElementById('game-sub').textContent=GAME.subtitle;
  const intro=document.getElementById('title-intro');
  intro.innerHTML='';
  GAME.intro.forEach((line,i)=>{
    const p=document.createElement('p');p.className='nar';p.style.animationDelay=(i*0.6+0.5)+'s';
    p.innerHTML='<em>'+line+'</em>';intro.appendChild(p);
  });
  // Check save
  const saved=localStorage.getItem('elba-dungeon');
  if(saved){
    document.getElementById('name-input-row').style.display='none';
    document.getElementById('title-continue').style.display='block';
  }
}
function showNewGame(){
  localStorage.removeItem('elba-dungeon');
  document.getElementById('name-input-row').style.display='flex';
  document.getElementById('title-continue').style.display='none';
}
function startGame(){
  const name=document.getElementById('name-inp').value.trim();
  if(!name){document.getElementById('name-inp').focus();return}
  const b=GAME.playerBase;
  S={name,floor:0,px:0,py:0,hp:b.hp,maxHp:b.maxHp,atk:b.atk,def:b.def,level:b.level,exp:b.exp,expNext:b.expNext,
     inventory:{},equip:{weapon:null,armor:null},defeated:[],pickedItems:[],mapActive:false};
  // Give starting item
  addItem('potion',2);
  addItem('staff',1);
  equipItem('staff');
  notify('탐험을 시작합니다, '+name+'님!');
  save();
  enterFloor(0);
}
function loadGame(){
  const d=localStorage.getItem('elba-dungeon');if(!d)return;
  try{Object.assign(S,JSON.parse(d))}catch(e){return}
  notify(S.name+'님, 다시 돌아오셨군요!');
  enterFloor(S.floor);
}

// ═══ INVENTORY ═══
function addItem(id,count){S.inventory[id]=(S.inventory[id]||0)+(count||1);save();renderInv()}
function useItem(id){
  if(!S.inventory[id])return false;
  const item=GAME.items[id];if(!item)return false;
  if(item.type==='consumable'){
    S.inventory[id]--;if(S.inventory[id]<=0)delete S.inventory[id];
    if(item.effect.heal){S.hp=Math.min(S.maxHp,S.hp+item.effect.heal)}
    save();renderStats();renderInv();return true;
  }
  if(item.type==='equip'){equipItem(id);return true}
  return false;
}
function equipItem(id){
  const item=GAME.items[id];if(!item||item.type!=='equip')return;
  S.equip[item.slot]=id;
  save();renderStats();renderInv();
}
function getAtkBonus(){const w=S.equip.weapon;return w&&GAME.items[w]?GAME.items[w].effect.atk||0:0}
function getDefBonus(){const a=S.equip.armor;return a&&GAME.items[a]?GAME.items[a].effect.def||0:0}
function renderInv(){
  const panel=document.getElementById('inv-panel');if(!panel)return;
  let h='<div class="inv-title">인벤토리</div>';
  const wep=S.equip.weapon?GAME.items[S.equip.weapon]:null;
  const arm=S.equip.armor?GAME.items[S.equip.armor]:null;
  if(wep)h+=`<div class="inv-item"><span class="iname">${wep.icon} ${wep.name} [장착]</span><span class="icount">ATK+${wep.effect.atk}</span></div>`;
  if(arm)h+=`<div class="inv-item"><span class="iname">${arm.icon} ${arm.name} [장착]</span><span class="icount">DEF+${arm.effect.def}</span></div>`;
  h+='<div style="border-top:1px solid #1a1a18;margin:6px 0"></div>';
  Object.keys(S.inventory).forEach(id=>{
    const item=GAME.items[id];if(!item)return;
    h+=`<div class="inv-item"><span class="iname">${item.icon} ${item.name}</span><span class="icount">x${S.inventory[id]}</span></div>`;
  });
  if(Object.keys(S.inventory).length===0&&!wep&&!arm)h+='<div style="color:#333">비어있음</div>';
  panel.innerHTML=h;
}

// ═══ STATS ═══
function renderStats(){
  const totalAtk=S.atk+getAtkBonus();
  const totalDef=S.def+getDefBonus();
  const hpPct=Math.round(S.hp/S.maxHp*100);
  document.getElementById('stats').innerHTML=`
    <span class="st"><span class="st-label">Lv.</span><span class="st-val st-lv">${S.level}</span></span>
    <span class="st"><span class="st-label">HP</span><span class="st-val st-hp">${S.hp}/${S.maxHp}</span><span class="hp-bar"><span class="hp-fill${hpPct<30?' low':''}" style="width:${hpPct}%"></span></span></span>
    <span class="st"><span class="st-label">ATK</span><span class="st-val st-atk">${totalAtk}</span></span>
    <span class="st"><span class="st-label">DEF</span><span class="st-val st-def">${totalDef}</span></span>
    <span class="st"><span class="st-label">EXP</span><span class="st-val">${S.exp}/${S.expNext}</span></span>
    <span class="st"><span class="st-label">적</span><span class="st-val">${floorDefeated()}/${floorEnemyCount()}</span></span>
  `;
  // Update battle player HP if in combat
  const bphp=document.getElementById('b-php');
  if(bphp){
    const prevHp=parseInt(bphp.textContent)||0;
    bphp.textContent=S.hp+'/'+S.maxHp;
    const bar=document.getElementById('b-php-bar');
    if(bar){bar.style.width=hpPct+'%';if(hpPct<30)bar.classList.add('low');else bar.classList.remove('low')}
    // Flash effect on HP change — inline style to avoid overriding fadeUp opacity
    const panel=document.getElementById('b-player');
    if(panel&&S.hp<prevHp){
      panel.style.animation='none';panel.offsetHeight;
      panel.style.animation='dmgFlash .4s ease';
      panel.addEventListener('animationend',()=>{panel.style.animation='none';},{once:true});
    }
    if(panel&&S.hp>prevHp){
      panel.style.animation='none';panel.offsetHeight;
      panel.style.animation='healFlash .4s ease';
      panel.addEventListener('animationend',()=>{panel.style.animation='none';},{once:true});
    }
  }
}
function floorEnemies(){return GAME.floors[S.floor]?GAME.floors[S.floor].enemies:[]}
function floorEnemyCount(){return floorEnemies().length}
function floorDefeated(){return floorEnemies().filter(id=>S.defeated.includes(id)).length}

// ═══ DUNGEON MAP ═══
function enterFloor(idx){
  S.floor=idx;
  const flObj=GAME.floors[idx];if(flObj)delete _posCache[flObj.id]; // clear cache
  const fl=GAME.floors[idx];if(!fl)return;
  S.px=fl.playerStart.x;S.py=fl.playerStart.y;
  showScreen('dungeon');
  document.getElementById('floor-name').textContent=fl.name;
  document.getElementById('floor-num').textContent=`B${fl.id}F`;
  const intro=document.getElementById('floor-intro');
  intro.textContent=fl.intro;intro.style.animation='none';intro.offsetHeight;intro.style.animation='';intro.className='nar';
  renderStats();renderMap();renderInv();
  startEnemyMovement();
  save();
  // Boss floor special effects
  const torch=document.getElementById('torch-overlay');
  const mapC=document.getElementById('map-container');
  if(fl.theme==='throne'){
    // Disable torch, add reveal + flash + shake
    torch.style.display='none';
    const reveal=document.createElement('div');reveal.id='throne-reveal';mapC.appendChild(reveal);
    const flash=document.createElement('div');flash.id='screen-flash';document.body.appendChild(flash);
    document.getElementById('wrap').classList.add('boss-shake');
    setTimeout(()=>{reveal.remove();flash.remove();document.getElementById('wrap').classList.remove('boss-shake')},3000);
    setTimeout(()=>{const m=document.getElementById('tilemap');if(m)m.focus()},3200);
  } else {
    torch.style.display='';
    // Remove leftover boss effects
    const old=document.getElementById('throne-reveal');if(old)old.remove();
    setTimeout(()=>{const m=document.getElementById('tilemap');if(m)m.focus()},100);
  }
}

function renderMap(){
  const fl=GAME.floors[S.floor];if(!fl)return;
  const grid=document.getElementById('tilemap');
  grid.style.gridTemplateColumns=`repeat(${COLS},24px)`;
  grid.innerHTML='';
  // Build enemy position map
  const enemyPos={};
  fl.enemies.forEach(eid=>{
    const e=ENEMIES[eid];if(!e)return;
    // Deterministic position from map: place enemies at valid floor tiles
    const pos=getEnemyPos(eid,fl);
    if(pos)enemyPos[pos.x+','+pos.y]=eid;
  });
  // Build item position map
  const itemPos={};
  fl.items.forEach((iid,i)=>{
    const key=S.floor+'-'+iid+'-'+i;
    if(S.pickedItems.includes(key))return;
    const pos=getItemPos(i,fl);
    if(pos)itemPos[pos.x+','+pos.y]={id:iid,key};
  });

  for(let y=0;y<ROWS;y++){
    const row=fl.map[y]||'';
    for(let x=0;x<COLS;x++){
      const ch=row[x]||'#';
      const div=document.createElement('div');
      const coordKey=x+','+y;

      if(x===S.px&&y===S.py){
        div.className='t t-p';div.textContent='@';
      } else if(enemyPos[coordKey]){
        const eid=enemyPos[coordKey];
        const e=ENEMIES[eid];
        const dead=S.defeated.includes(eid);
        const color=TEAM_COLORS[e.team]||'#888';
        div.className='t t-e'+(dead?' dead':'');
        div.style.background=dead?'#111':color+'30';div.style.color=dead?'#333':color;
        div.textContent=e.name[0];
        div.title=e.name+' '+e.title;
      } else if(itemPos[coordKey]){
        div.className='t t-i';div.textContent='✦';
      } else if(fl.stairsPos&&x===fl.stairsPos.x&&y===fl.stairsPos.y){
        div.className='t t-s';div.textContent='>';
      } else if(ch==='#'){
        div.className='t t-w';div.textContent='·';
      } else {
        div.className='t t-f';div.textContent='·';
      }
      grid.appendChild(div);
    }
  }
  // Zone display
  document.getElementById('map-zone').textContent=fl.name+' — '+fl.intro.substring(0,30)+'...';
  S.mapActive=true;
}

// Deterministic enemy/item placement (no overlaps)
const _posCache={};
function getAllPositions(fl){
  const key=fl.id;
  if(_posCache[key])return _posCache[key];
  const validTiles=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(fl.map[y][x]==='.'&&!(x===fl.playerStart.x&&y===fl.playerStart.y)&&
       !(fl.stairsPos&&x===fl.stairsPos.x&&y===fl.stairsPos.y))
      validTiles.push({x,y});
  }
  // Assign unique positions to each enemy using seeded shuffle
  const used=new Set();
  const positions={};
  fl.enemies.forEach(eid=>{
    let hash=0;for(let i=0;i<eid.length;i++)hash=((hash<<5)-hash)+eid.charCodeAt(i);
    hash=Math.abs(hash);
    let idx=hash%validTiles.length;
    let tries=0;
    while(used.has(idx)&&tries<validTiles.length){idx=(idx+1)%validTiles.length;tries++}
    used.add(idx);
    positions[eid]=validTiles[idx];
  });
  // Items
  fl.items.forEach((iid,i)=>{
    let hash=(i+1)*7919+fl.id*131;
    let idx=Math.abs(hash)%validTiles.length;
    let tries=0;
    while(used.has(idx)&&tries<validTiles.length){idx=(idx+1)%validTiles.length;tries++}
    used.add(idx);
    positions['item_'+i]=validTiles[idx];
  });
  _posCache[key]=positions;
  return positions;
}
function getEnemyPos(eid,fl){return getAllPositions(fl)[eid]}
function getItemPos(idx,fl){return getAllPositions(fl)['item_'+idx]}

// ═══ MOVEMENT ═══
function movePlayer(dx,dy){
  if(!S.mapActive)return;
  const fl=GAME.floors[S.floor];if(!fl)return;
  const nx=S.px+dx,ny=S.py+dy;
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return;
  if(fl.map[ny][nx]==='#')return;
  // Check enemy at target
  const eAtTarget=getEnemyAtPos(nx,ny,fl);
  if(eAtTarget&&!S.defeated.includes(eAtTarget)){startBattle(eAtTarget);return}
  // Check item at target
  const iAtTarget=getItemAtPos(nx,ny,fl);
  if(iAtTarget){pickupItem(iAtTarget);/* still move */}
  S.px=nx;S.py=ny;save();
  renderMap();
  // Check if standing on a remaining enemy (edge case from load)
  const eHere=getEnemyAtPos(nx,ny,fl);
  if(eHere&&!S.defeated.includes(eHere)){startBattle(eHere);return}
  // Check stairs
  if(fl.stairsPos&&nx===fl.stairsPos.x&&ny===fl.stairsPos.y){
    if(floorDefeated()>=floorEnemyCount()){
      S.mapActive=false;
      setTimeout(()=>clearFloor(),300);
    } else {
      notify('모든 적을 처치해야 다음 층으로 내려갈 수 있습니다. ('+floorDefeated()+'/'+floorEnemyCount()+')');
    }
  }
}

function getEnemyAtPos(x,y,fl){
  for(const eid of fl.enemies){
    const pos=getEnemyPos(eid,fl);
    if(pos&&pos.x===x&&pos.y===y)return eid;
  }return null;
}
function getItemAtPos(x,y,fl){
  for(let i=0;i<fl.items.length;i++){
    const key=S.floor+'-'+fl.items[i]+'-'+i;
    if(S.pickedItems.includes(key))continue;
    const pos=getItemPos(i,fl);
    if(pos&&pos.x===x&&pos.y===y)return{id:fl.items[i],key,idx:i};
  }return null;
}
function pickupItem(info){
  addItem(info.id,1);
  S.pickedItems.push(info.key);
  const item=GAME.items[info.id];
  notify(GAME.battle.itemFound.replace('{icon}',item.icon).replace('{item}',item.name));
  save();
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(!S.mapActive)return;
  if(document.getElementById('battle').classList.contains('show'))return;
  const k=e.key;
  if(k==='ArrowUp'||k==='w'){e.preventDefault();movePlayer(0,-1)}
  else if(k==='ArrowDown'||k==='s'){e.preventDefault();movePlayer(0,1)}
  else if(k==='ArrowLeft'||k==='a'){e.preventDefault();movePlayer(-1,0)}
  else if(k==='ArrowRight'||k==='d'){e.preventDefault();movePlayer(1,0)}
});

// ═══ ENEMY MOVEMENT ═══
let enemyMoveTimer=null;
function startEnemyMovement(){
  stopEnemyMovement();
  enemyMoveTimer=setInterval(()=>{
    if(!S.mapActive)return;
    const fl=GAME.floors[S.floor];if(!fl)return;
    const positions=getAllPositions(fl);
    let moved=false;
    fl.enemies.forEach(eid=>{
      if(S.defeated.includes(eid))return;
      if(Math.random()>0.7)return; // 70% chance to move each tick
      const pos=positions[eid];if(!pos)return;
      const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
      const dir=dirs[Math.floor(Math.random()*dirs.length)];
      const nx=pos.x+dir[0],ny=pos.y+dir[1];
      if(nx<1||nx>=COLS-1||ny<1||ny>=ROWS-1)return;
      if(fl.map[ny][nx]!=='.'&&fl.map[ny][nx]!=='+')return;
      // Don't move onto another enemy, stairs, item, or player start
      const occupied=Object.entries(positions).some(([k,p])=>k!==eid&&p.x===nx&&p.y===ny);
      if(occupied)return;
      if(fl.stairsPos&&nx===fl.stairsPos.x&&ny===fl.stairsPos.y)return;
      // Check if player is there → trigger battle!
      if(nx===S.px&&ny===S.py){startBattle(eid);return}
      pos.x=nx;pos.y=ny;moved=true;
    });
    if(moved)renderMap();
  },1000);
}
function stopEnemyMovement(){if(enemyMoveTimer){clearInterval(enemyMoveTimer);enemyMoveTimer=null}}

        <span class="hp-bar" style="width:80px"><span class="hp-fill" id="b-ehp-bar" style="width:100%"></span></span>

        <span style="color:#c4b898;font-weight:700">${S.name}</span>
        <span style="color:#8a7a5a">Lv.${S.level}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="color:#5a9a4a">HP</span>
        <span id="b-php" style="color:#5a9a4a;font-weight:700">${S.hp}/${S.maxHp}</span>
        <span class="hp-bar" style="width:100px"><span class="hp-fill" id="b-php-bar" style="width:${Math.round(S.hp/S.maxHp*100)}%"></span></span>

      <div style="display:flex;gap:12px;color:#8a7a5a">
        <span>ATK <span style="color:#c4651a">${S.atk+getAtkBonus()}</span></span>
        <span>DEF <span style="color:#3a5a8b">${S.def+getDefBonus()}</span></span>

      </div>
    </div>
    <div id="b-log"></div>
    <div id="b-actions">
      <button class="btn" onclick="battleAction('attack')">⚔️ 공격</button>
      <button class="btn" onclick="battleAction('defend')">🛡️ 방어</button>
      <button class="btn" onclick="battleAction('item')">🧪 아이템 ${S.inventory.potion?'(물약 x'+S.inventory.potion+')':''}</button>
      <button class="btn" onclick="battleAction('flee')" style="border-color:#333;color:#555">🏃 도망</button>
    </div>
  `;
  // Reset animations
  box.querySelectorAll('[class*="b-"]').forEach(el=>{el.style.animation='none';el.offsetHeight;el.style.animation=''});
  // Lock opacity after fadeUp so shake/flash don't reset it

function battleAction(action){
  const bs=battleState;if(!bs||bs.busy)return;
  bs.busy=true;
  const e=ENEMIES[bs.eid];
  const totalAtk=S.atk+getAtkBonus();
  const totalDef=S.def+getDefBonus();
  let playerActed=true;

  if(action==='attack'){
    // Crit (15%) / Miss (10%)
    const roll=Math.random();
    if(roll<0.10){
      blogAdd('공격이 빗나갔다!','miss');
    } else {
      const isCrit=roll>0.85;
      let dmg=Math.max(1,totalAtk-bs.edef+Math.floor(Math.random()*6)-2);
      if(isCrit)dmg=Math.floor(dmg*1.8);
      bs.ehp=Math.max(0,bs.ehp-dmg);
      const wepName=S.equip.weapon?GAME.items[S.equip.weapon].name:'맨손';
      if(isCrit)blogAdd('★ 치명타! '+wepName+'이(가) 빛난다! '+e.name+'에게 '+dmg+' 데미지!','crit');
      else blogAdd(GAME.battle.playerAttack.replace('{weapon}',wepName).replace('{enemy}',e.name).replace('{dmg}',dmg),'dmg');
      updateEnemyHP();
      if(bs.ehp<=0){enemyDefeated();return}
    }
    bs.defending=false;
  } else if(action==='defend'){
    blogAdd(GAME.battle.playerDefend,'info');
    bs.defending=true;
  } else if(action==='item'){
    if(S.inventory.potion){
      useItem('potion');blogAdd('시간의 물약을 사용했다! HP +30','heal');
    } else if(S.inventory.scroll){
      S.inventory.scroll--;if(S.inventory.scroll<=0)delete S.inventory.scroll;
      bs.eatk=Math.max(1,bs.eatk-5);blogAdd('결재의 주문서! 적 ATK -5','info');renderInv();
    } else {blogAdd('사용할 아이템이 없다!','info');bs.busy=false;return}
  } else if(action==='flee'){
    if(e.isBoss){blogAdd('보스에게서는 도망칠 수 없다!','info');bs.busy=false;return}
    if(Math.random()<0.5){blogAdd(GAME.battle.fled,'info');setTimeout(()=>endBattle(),500);return}
    else{blogAdd('도망에 실패했다!','info')}
  }

  // Enemy turn(s)
  setTimeout(()=>{
    // Boss double attack at <50% HP
    const attacks=e.isBoss&&bs.ehp<bs.emaxHp*0.5?2:1;
    for(let i=0;i<attacks;i++){
      setTimeout(()=>{
        const eRoll=Math.random();
        if(eRoll<0.08){blogAdd(e.name+'의 공격이 빗나갔다!','miss');
        } else {
          const eCrit=eRoll>0.88;
          let edmg=Math.max(1,bs.eatk-totalDef+Math.floor(Math.random()*5)-1);
          if(bs.defending)edmg=Math.floor(edmg/2);
          if(eCrit)edmg=Math.floor(edmg*1.7);
          S.hp=Math.max(0,S.hp-edmg);
          if(eCrit)blogAdd('★ '+e.name+'의 치명타! '+e.skill+'! '+edmg+' 데미지!','crit');
          else blogAdd(GAME.battle.enemyAttack.replace('{enemy}',e.name).replace('{skill}',e.skill).replace('{dmg}',edmg),'dmg');
          renderStats();
        }
        // Boss heal at <30% HP (once)
        if(e.isBoss&&bs.ehp>0&&bs.ehp<bs.emaxHp*0.3&&!bs.healed){
          bs.healed=true;const heal=Math.floor(bs.emaxHp*0.15);
          bs.ehp=Math.min(bs.emaxHp,bs.ehp+heal);
          blogAdd(e.name+'이(가) 기력을 회복했다! HP +'+heal,'heal');
          updateEnemyHP();
        }
        // Check death
        if(S.hp<=0){playerDied();return}
        if(i===attacks-1)bs.busy=false;
      },i*500);
    }
    if(attacks===1)bs.busy=false;
  },500);
}
function playerDied(){
  battleState=null;
  document.getElementById('battle').classList.remove('show');
  document.getElementById('gameover').classList.add('show');
  stopEnemyMovement();
}
function retryFloor(){
  document.getElementById('gameover').classList.remove('show');
  const b=GAME.playerBase;
  S.hp=S.maxHp;
  // Remove defeated enemies from current floor only
  const fl=GAME.floors[S.floor];
  S.defeated=S.defeated.filter(id=>!fl.enemies.includes(id));
  S.pickedItems=S.pickedItems.filter(k=>!k.startsWith(S.floor+'-'));
  save();
  enterFloor(S.floor);
}

function blogAdd(text,cls){
  const log=document.getElementById('b-log');
  const p=document.createElement('p');p.className=cls||'';p.textContent=text;
  log.appendChild(p);log.scrollTop=log.scrollHeight;
}
function updateEnemyHP(){
  const bs=battleState;
  document.getElementById('b-ehp').textContent=bs.ehp;
  const pct=Math.round(bs.ehp/bs.emaxHp*100);
  const bar=document.getElementById('b-ehp-bar');
  bar.style.width=pct+'%';
  if(pct<30)bar.classList.add('low');
  const card=document.getElementById('b-card');
  // Use inline style to combine both animations — avoids opacity conflict with CSS class animation
  card.style.animation='none';card.offsetHeight;
  card.style.animation='shake .3s ease, dmgFlash .4s ease';
  card.addEventListener('animationend',()=>{card.style.animation='none';},{once:true});
}
function enemyDefeated(){
  const bs=battleState;const e=ENEMIES[bs.eid];
  S.defeated.push(bs.eid);
  S.exp+=e.exp;
  blogAdd(GAME.battle.enemyDefeated.replace('{enemy}',e.name).replace('{exp}',e.exp),'info');
  document.getElementById('b-dialog').textContent='"'+e.defeat+'"';
  // Level up check
  while(S.exp>=S.expNext){
    S.exp-=S.expNext;S.level++;
    const b=GAME.levelUpBonus;
    S.maxHp+=b.hp;S.hp=S.maxHp;S.atk+=b.atk;S.def+=b.def;S.expNext+=b.expNext;
    blogAdd(GAME.battle.levelUp.replace('{level}',S.level).replace('{hp}',b.hp).replace('{atk}',b.atk).replace('{def}',b.def),'info');
    notify('레벨 업! Lv.'+S.level);
  }
  save();renderStats();
  // If boss defeated → go straight to ending
  if(e.isBoss){
    document.getElementById('b-actions').innerHTML='<button class="btn btn-accent" onclick="endBattleToEnding()">운명을 받아들인다</button>';
  } else {
    document.getElementById('b-actions').innerHTML='<button class="btn btn-accent" onclick="endBattle()">돌아간다</button>';
  }
}
function endBattleToEnding(){
  document.getElementById('battle').classList.remove('show');
  document.getElementById('wrap').classList.remove('boss-shake');
  battleState=null;stopEnemyMovement();
  showEnding();
}
function endBattle(){
  document.getElementById('battle').classList.remove('show');
  document.getElementById('wrap').classList.remove('shake');
  document.getElementById('wrap').classList.remove('boss-shake');
  battleState=null;
  S.mapActive=true;renderMap();renderStats();
  startEnemyMovement();
  setTimeout(()=>{const m=document.getElementById('tilemap');if(m)m.focus()},100);
}

    <div style="width:60px;height:2px;background:var(--accent);margin:16px auto;opacity:0;animation:fadeUp 1s 1.5s forwards"></div>
  </div>`;

    h+=`<p class="nar" style="animation-delay:${(i*1.5+2)}s;text-align:center"><em>${line}</em></p>`;
  });
  const delay=t*1.5+3;
  h+=`<div style="text-align:center;margin:32px 0;opacity:0;animation:fadeUp 1s ${delay}s forwards">
    <div style="width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:24px"></div>
    <div style="font-size:11px;color:var(--ink2);letter-spacing:3px;margin-bottom:16px">그리고 이야기는 현실로 이어진다...</div>
    <p style="color:var(--ink);font-size:14px;line-height:2">
      이 동굴의 이름은 <strong style="color:var(--accent)">ELBA</strong>.<br>
      당신이 만난 적들은, 사실 앞으로 함께할 <strong>동료</strong>들이다.<br>
      그들의 스킬은 실제 업무 역량이고, 던전의 각 층은 팀의 영역이다.<br><br>
      <span style="color:var(--accent);font-style:italic">"ELBA is ABLE — 그리고 이제, 당신도."</span>
    </p>
  </div>`;
  h+=`<div class="box box-accent" style="opacity:0;animation:fadeUp .8s ${delay+2}s forwards">
    <div class="box-title t-accent">📜 모험의 기록</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div>탐험가: <strong>${S.name}</strong></div>
      <div>최종 레벨: <strong>Lv.${S.level}</strong></div>
      <div>처치한 적: <strong>${S.defeated.length}명</strong></div>
      <div>탐파한 층: <strong>${S.floor+1}층</strong></div>
      <div>최종 HP: <strong>${S.hp}/${S.maxHp}</strong></div>
      <div>최종 ATK: <strong>${S.atk+getAtkBonus()}</strong></div>
    </div>
  </div>`;
  h+=`<div style="opacity:0;animation:fadeUp .6s ${delay+3.5}s forwards;text-align:center;margin-top:24px">
    <p style="font-size:12px;color:var(--ink2);margin-bottom:16px;font-style:italic">환영합니다, ELBA의 새로운 동료님.</p>
    <button class="btn btn-accent" style="max-width:300px;margin:0 auto;text-align:center" onclick="restart()">다시 탐험하기</button>
  </div>`;
  content.innerHTML=h;
  showScreen('ending');
  // Golden flash for ending
  const flash=document.createElement('div');flash.id='screen-flash';document.body.appendChild(flash);
  setTimeout(()=>flash.remove(),1000);
}
function restart(){localStorage.removeItem('elba-dungeon');location.reload()}

// ═══ INIT ═══
document.addEventListener('DOMContentLoaded',()=>{
  initTitle();
  document.getElementById('name-inp').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});
});
</script>
</body>
</html>
